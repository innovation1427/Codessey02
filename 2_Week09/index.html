<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한송희 박사 TO-DO 리스트</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 간단한 커스텀 스타일 */
        body { font-family: 'Inter', sans-serif; }
        .btn {
            @apply px-4 py-2 rounded-lg font-semibold shadow transition-all duration-200;
        }
        .btn-primary {
            @apply bg-blue-600 text-white hover:bg-blue-700;
        }
        .btn-danger {
            @apply bg-red-500 text-white hover:bg-red-600;
        }
        .btn-warning {
            @apply bg-yellow-500 text-white hover:bg-yellow-600;
        }
        .list-item {
            @apply flex justify-between items-center bg-white p-4 rounded-lg shadow mb-3;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto max-w-2xl p-4 md:p-8">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-gray-800">🚀 한송희 박사 TO-DO 리스트</h1>
            <p class="text-lg text-gray-600">Mars-Earth Sync</p>
        </header>

        <!-- 할 일 추가 폼 -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-8">
            <h2 class="text-2xl font-semibold mb-4">새 작업 추가</h2>
            <div class="flex space-x-4">
                <input type="text" id="task-input" class="flex-grow border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500" placeholder="예: 화성 기지 산소 농도 체크">
                <button id="add-btn" class="btn btn-primary">추가</button>
            </div>
            <p id="error-msg" class="text-red-500 text-sm mt-2 hidden"></p>
        </div>

        <!-- 할 일 목록 -->
        <div>
            <h2 class="text-2xl font-semibold mb-4">작업 목록</h2>
            <ul id="todo-list">
                <!-- JavaScript가 이 목록을 채웁니다. -->
            </ul>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/todos';
        const todoList = document.getElementById('todo-list');
        const taskInput = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const errorMsg = document.getElementById('error-msg');

        // --- 공통 함수: 에러 메시지 표시 ---
        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.remove('hidden');
        }
        function clearError() {
            errorMsg.classList.add('hidden');
        }

        // --- 1. (GET) 모든 할 일 목록 가져오기 ---
        async function fetchTodos() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('서버에서 목록을 불러오는 데 실패했습니다.');
                
                const data = await response.json();
                todoList.innerHTML = ''; // 목록 초기화

                if (data.todos.length === 0) {
                    todoList.innerHTML = '<li class="text-gray-500 text-center p-4">✅ 완료! 작업 목록이 비어있습니다.</li>';
                } else {
                    data.todos.forEach(todo => {
                        const li = document.createElement('li');
                        li.className = 'list-item';
                        li.innerHTML = `
                            <span class="text-lg text-gray-700">${todo.task}</span>
                            <div class="flex space-x-2">
                                <button class="btn btn-warning btn-sm" onclick="handleUpdate(${todo.id})">수정</button>
                                <button class="btn btn-danger btn-sm" onclick="handleDelete(${todo.id})">삭제</button>
                            </div>
                        `;
                        todoList.appendChild(li);
                    });
                }
            } catch (err) {
                console.error('Fetch Error:', err);
                showError(err.message);
            }
        }

        // --- 2. (POST) 할 일 추가하기 ---
        async function addTodo() {
            const task = taskInput.value.trim();
            if (task === '') {
                showError('할 일 내용을 입력하세요.');
                return;
            }
            clearError();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task: task })
                });

                if (response.status === 422) {
                    const errorData = await response.json();
                    showError(errorData.detail[0].msg || '입력값이 유효하지 않습니다.');
                    return;
                }
                if (!response.ok) throw new Error('작업 추가에 실패했습니다.');

                taskInput.value = ''; // 입력창 비우기
                await fetchTodos(); // 목록 새로고침
            } catch (err) {
                console.error('Add Error:', err);
                showError(err.message);
            }
        }

        // --- 3. (DELETE) 할 일 삭제하기 ---
        async function handleDelete(id) {
            if (!confirm(`정말로 이 작업을 삭제하시겠습니까?`)) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('작업 삭제에 실패했습니다.');
                
                await fetchTodos(); // 목록 새로고침
            } catch (err) {
                console.error('Delete Error:', err);
                showError(err.message);
            }
        }

        // --- 4. (PUT) 할 일 수정하기 ---
        async function handleUpdate(id) {
            const currentTask = document.querySelector(`li[data-id='${id}'] span`)?.textContent;
            const newTask = prompt('새로운 작업 내용을 입력하세요:', currentTask || '');

            if (newTask === null || newTask.trim() === '') return; // 취소하거나 빈 값이면 무시

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task: newTask.trim() })
                });

                if (response.status === 422) {
                    showError('입력값이 유효하지 않습니다. (1글자 이상)');
                    return;
                }
                if (!response.ok) throw new Error('작업 수정에 실패했습니다.');
                
                await fetchTodos(); // 목록 새로고침
            } catch (err) {
                console.error('Update Error:', err);
                showError(err.message);
            }
        }

        // --- 이벤트 리스너 연결 ---
        addBtn.addEventListener('click', addTodo);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        // --- 페이지 로드 시 첫 목록 불러오기 ---
        document.addEventListener('DOMContentLoaded', fetchTodos);
    </script>
</body>
</html>
